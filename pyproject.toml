[project]
name = "tp6-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angeraiyane", email = "angeraiyane@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "ipython>=9.18.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.0.0",
    "sentence-transformers>=6.2.0",
    "vectorstore>=0.0.0",
]

[project.scripts]
tp6-agentic = "tp6_agentic:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
